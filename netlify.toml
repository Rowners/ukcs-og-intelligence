# Next.js app lives in web/. Publish is relative to that base, so Netlify
# publishes web/.next. The runtime below must be declared explicitly: a site
# whose UI build settings only set base/command/publish uploads the raw .next
# folder and never installs the OpenNext adapter (plugin_state "none", no
# functions, every route 404).
#
# @netlify/plugin-nextjs v5 (Next.js 13.5+) turns the App Router, including
# /api/briefings, /api/production and /api/prices, into one Netlify server
# function and serves the static assets from the adapter output.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# netlify dev: Next.js listens on 3000, the Netlify wrapper on 8888.
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "#auto"
