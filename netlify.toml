# Next.js app lives in web/. Netlify installs the current OpenNext-based
# Next.js runtime during the build (Next.js 13.5+). Do not pin
# @netlify/plugin-nextjs — Netlify updates that adapter on each build.
#
# Publish is relative to the base directory. The deployable output is web/.next.
# Route handlers under web/src/app/api/* become Netlify Functions.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# netlify dev: Next.js listens on 3000, the Netlify wrapper on 8888.
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "#auto"
